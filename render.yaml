# Render Blueprint for RoomTrace (always-on Node server).
# Free plan for first tests. The free tier sleeps after ~15 min without traffic: the first request
# after that is slow, the ESP32 drops frames until the service is awake, and WebSockets reconnect.
# For always-on use, change `plan` to a paid one (e.g. starter). Check current Render pricing.
services:
  - type: web
    name: roomtrace
    runtime: node
    plan: free
    # Use the committed lockfile so Render never needs to resolve the dependency tree.
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # RENDER=true is set by Render itself; vite.config.ts then builds the Nitro "node-server" preset.
      # Client Firebase config (public values from Firebase Console > Project settings > Your apps).
      # These are baked into the browser bundle at build time, so set them before the first deploy.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Server-only secrets (never VITE_-prefixed). Paste the whole service-account JSON as one value.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
